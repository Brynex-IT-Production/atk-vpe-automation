name: ATK DEV create guided templates once
on:
  push:
    paths:
      - '.github/workflows/create-guided-templates-once.yml'
permissions:
  contents: read
jobs:
  create:
    runs-on: ubuntu-latest
    steps:
      - name: Wait for DEV deployment and create missing templates
        shell: bash
        run: |
          sleep 75
          response=$(curl --location --fail-with-body --silent --show-error \
            --header 'Content-Type: application/json' \
            --data '{"system_action":"CREATE_WA_TEMPLATES","verify_token":"ATK_VPE_VERIFY_2026_X7K9M4P2"}' \
            'https://script.google.com/macros/s/AKfycbwzHdJptr44J1aWN4UqHp6qN435kwFPbG8ngYGEYABqypF2urE0Jyd0hLd63M-wYVVE/exec')
          echo "$response"
          RESPONSE="$response" python3 - <<'PY'
          import json, os
          result = json.loads(os.environ['RESPONSE'])
          assert result['ok'], result
          PY
