name: Create ATK WhatsApp Templates

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/create-wa-templates.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  create:
    runs-on: ubuntu-latest
    steps:
      - name: Submit ATK WhatsApp templates
        shell: bash
        run: |
          response=$(curl --location --fail-with-body --silent --show-error \
            --header 'Content-Type: application/json' \
            --data '{"system_action":"CREATE_WA_TEMPLATES","verify_token":"ATK_VPE_VERIFY_2026_X7K9M4P2"}' \
            'https://script.google.com/macros/s/AKfycbwzHdJptr44J1aWN4UqHp6qN435kwFPbG8ngYGEYABqypF2urE0Jyd0hLd63M-wYVVE/exec')

          echo "$response"

          if ! echo "$response" | grep -q '"ok":true'; then
            echo "Template submission returned errors."
            exit 1
          fi
