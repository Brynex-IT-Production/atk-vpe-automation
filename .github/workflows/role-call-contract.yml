name: ATK Role Call Contract

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  role-call-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify Utility V3 role calls and button-only contract
        run: |
          node tests/role-call-contract.test.js
          node tests/daily-role-reminders.test.js
          node tests/api-meeting-read-contract.test.js
          node tests/speaker-handoff-contract.test.js
