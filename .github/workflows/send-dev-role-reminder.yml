name: Send DEV role reminder once

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/send-dev-role-reminder.yml'

permissions:
  contents: read

concurrency:
  group: atk-vpe-dev
  cancel-in-progress: false

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - name: Send approved role reminder to sole DEV recipient
        shell: bash
        run: |
          response=$(curl --location --fail-with-body --silent --show-error \
            --header 'Content-Type: application/json' \
            --data '{"system_action":"TEST_ROLE_TEMPLATE_ONLY","verify_token":"ATK_VPE_VERIFY_2026_X7K9M4P2"}' \
            'https://script.google.com/macros/s/AKfycbwzHdJptr44J1aWN4UqHp6qN435kwFPbG8ngYGEYABqypF2urE0Jyd0hLd63M-wYVVE/exec')
          echo "$response"
          echo "$response" | grep -q '"sent":true'
          echo "$response" | grep -Eq '"meeting_no":[0-9]+'
