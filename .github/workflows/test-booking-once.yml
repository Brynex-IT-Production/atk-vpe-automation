name: ATK DEV one-time speech booking check
on:
  push:
    paths:
      - '.github/workflows/test-booking-once.yml'
permissions:
  contents: read
jobs:
  booking:
    runs-on: ubuntu-latest
    steps:
      - name: Book then retry DEV speech slot
        shell: bash
        run: |
          for payload in '{"entry":[{"changes":[{"value":{"messages":[{"id":"atk-dev-speech-book-1-20260927","from":"919746462423","type":"button","button":{"payload":"SPEAK|450","text":"Reserve speech slot"}}]}}]}]}' '{"entry":[{"changes":[{"value":{"messages":[{"id":"atk-dev-speech-book-2-20260927","from":"919746462423","type":"button","button":{"payload":"SPEAK|450","text":"Reserve speech slot"}}]}}]}]}'; do
            response=$(curl --location --fail-with-body --silent --show-error \
              --header 'Content-Type: application/json' \
              --data "$payload" \
              'https://script.google.com/macros/s/AKfycbwzHdJptr44J1aWN4UqHp6qN435kwFPbG8ngYGEYABqypF2urE0Jyd0hLd63M-wYVVE/exec')
            test "$response" = "EVENT_RECEIVED"
          done
