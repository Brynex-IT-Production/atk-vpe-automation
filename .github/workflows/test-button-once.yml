name: ATK DEV one-time button template check
on:
  push:
    paths:
      - '.github/workflows/test-button-once.yml'
permissions:
  contents: read
jobs:
  template-check:
    runs-on: ubuntu-latest
    steps:
      - name: Send approved templates to VPE allowlisted number
        shell: bash
        run: |
          response=$(curl --location --fail-with-body --silent --show-error \
            --header 'Content-Type: application/json' \
            --data '{"system_action":"TEST_APPROVED_WA_TEMPLATES","verify_token":"ATK_VPE_VERIFY_2026_X7K9M4P2"}' \
            'https://script.google.com/macros/s/AKfycbwzHdJptr44J1aWN4UqHp6qN435kwFPbG8ngYGEYABqypF2urE0Jyd0hLd63M-wYVVE/exec')
          echo "$response"
