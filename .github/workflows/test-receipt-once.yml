name: ATK DEV receipt ordering check
on:
  push:
    paths:
      - '.github/workflows/test-receipt-once.yml'
permissions:
  contents: read
jobs:
  receipt:
    runs-on: ubuntu-latest
    steps:
      - name: Replay delivered then sent status for existing DEV test message
        shell: bash
        run: |
          for payload in '{"entry":[{"changes":[{"value":{"statuses":[{"id":"wamid.HBgMOTE5NzQ2NDYyNDIzFQIAERgSODBGRTZGOTc0QzQ2MkQyRTMxAA==","status":"delivered","recipient_id":"919746462423"}]}}]}]}' '{"entry":[{"changes":[{"value":{"statuses":[{"id":"wamid.HBgMOTE5NzQ2NDYyNDIzFQIAERgSODBGRTZGOTc0QzQ2MkQyRTMxAA==","status":"sent","recipient_id":"919746462423"}]}}]}]}'; do
            response=$(curl --location --fail-with-body --silent --show-error \
              --header 'Content-Type: application/json' \
              --data "$payload" \
              'https://script.google.com/macros/s/AKfycbwzHdJptr44J1aWN4UqHp6qN435kwFPbG8ngYGEYABqypF2urE0Jyd0hLd63M-wYVVE/exec')
            test "$response" = "EVENT_RECEIVED"
          done
