name: ATK DEV one-time template delivery check
on:
  push:
    paths:
      - '.github/workflows/test-template-once.yml'
permissions:
  contents: read
jobs:
  template-check:
    if: github.event.head_commit.message == 'Run ATK DEV template billing check'
    runs-on: ubuntu-latest
    steps:
      - name: Send approved role reminder to VPE allowlisted number
        shell: bash
        run: |
          response=$(curl --location --fail-with-body --silent --show-error \
            --header 'Content-Type: application/json' \
            --data '{"system_action":"TEST_ROLE_TEMPLATE_ONLY","verify_token":"ATK_VPE_VERIFY_2026_X7K9M4P2"}' \
            'https://script.google.com/macros/s/AKfycbwzHdJptr44J1aWN4UqHp6qN435kwFPbG8ngYGEYABqypF2urE0Jyd0hLd63M-wYVVE/exec')
          echo "$response"
